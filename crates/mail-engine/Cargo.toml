[package]
name = "mail-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
mail-parser = { version = "1.0.0", features = ["full_encoding", "serde"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
quick-xml = "0.42.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
thiserror = { workspace = true }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
url = "2.5.8"
vault = { workspace = true }
webpki-roots = "1.0.11"
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
