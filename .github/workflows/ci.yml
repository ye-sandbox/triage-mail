name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Policy scanner regressions
        run: node --test scripts/ci-guard.test.mjs
      - name: Tracked text and Svelte policy
        run: node scripts/ci-guard.mjs
      - name: Whitespace
        run: git diff-tree --check --root -m HEAD
      - name: Install frontend dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - run: pnpm --filter desktop check
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop build

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config perl libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # INVARIANT: Tests use synthetic local fixtures; no provider credentials or models.
      - name: Workspace validation (offline after fetch)
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
