[package]
name = "triage-mail-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "triage_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["native-runtime"]
native-runtime = ["dep:tauri", "dep:tauri-build"]
performance-validation = ["native-runtime"]

[[example]]
name = "native_performance"
required-features = ["performance-validation"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
async-trait = "0.1.92"
getrandom = "0.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zeroize = "1.9.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2.5.8"
tauri = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vault = { workspace = true }
storage = { workspace = true }
mail-engine = { workspace = true }
triage-ai = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
