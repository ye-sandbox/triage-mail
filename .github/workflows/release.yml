name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-tauri:
    name: Build (${{ matrix.platform }}${{ matrix.name_suffix && format(' - {0}', matrix.name_suffix) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            name_suffix: 'Linux'
            args: ''
          - platform: 'macos-latest'
            name_suffix: 'macOS Universal'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            name_suffix: 'Windows'
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: '11.25.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-release
          key: ${{ matrix.platform }}-${{ matrix.args || 'default' }}-${{ hashFiles('Cargo.toml') }}

      - name: Install Linux native prerequisites
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config perl libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf librsvg2-bin

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'apps/desktop'
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'triage-mail ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: false
          args: ${{ matrix.args }}
